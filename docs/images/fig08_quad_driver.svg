<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="Arial, sans-serif" font-size="13">
  <style>
    .ttl { font-size: 16px; font-weight: bold; }
    .lbl { font-size: 12px; }
    .num { font-size: 12px; font-weight: bold; }
    .box { fill: #eef4ff; stroke: #000; stroke-width: 1.4; }
    .pwr { fill: #ffefea; stroke: #000; stroke-width: 1.4; }
    .ctl { fill: #e6f7e6; stroke: #000; stroke-width: 1.4; }
    .ch  { fill: #fff7d8; stroke: #000; stroke-width: 1.4; }
    .ln { stroke: #000; stroke-width: 1.4; fill: none; }
    .sig { stroke: #1a4fb0; stroke-width: 1.4; fill: none; }
  </style>

  <text x="500" y="24" text-anchor="middle" class="ttl">FIG. 8 — Quad H-bridge Driver Architecture (per controller board)</text>

  <!-- Power input -->
  <rect class="pwr" x="40" y="60" width="120" height="60"/>
  <text x="100" y="84" text-anchor="middle" class="lbl">USB-C / DC in</text>
  <text x="100" y="102" text-anchor="middle" class="lbl">5–24 V</text>

  <!-- Boost / preregulator -->
  <rect class="pwr" x="200" y="60" width="160" height="60"/>
  <text x="280" y="84" text-anchor="middle" class="lbl">Boost / preregulator</text>
  <text x="280" y="102" text-anchor="middle" class="lbl">(TPS40210, V_drive)</text>
  <line class="sig" x1="160" y1="90" x2="200" y2="90" marker-end="url(#aE)"/>

  <!-- 3.3V LDO -->
  <rect class="pwr" x="200" y="140" width="160" height="40"/>
  <text x="280" y="164" text-anchor="middle" class="lbl">3.3 V LDO (logic)</text>
  <line class="sig" x1="160" y1="100" x2="180" y2="100" marker-end="url(#aE)"/>
  <line class="sig" x1="180" y1="100" x2="180" y2="160"/>
  <line class="sig" x1="180" y1="160" x2="200" y2="160"/>

  <!-- MCU -->
  <rect class="ctl" x="400" y="60" width="200" height="160"/>
  <text x="500" y="86" text-anchor="middle" class="lbl">STM32G474 MCU</text>
  <text x="500" y="106" text-anchor="middle" class="lbl">• 4× HRTIM PWM channels</text>
  <text x="500" y="124" text-anchor="middle" class="lbl">• 4× current ADC inputs</text>
  <text x="500" y="142" text-anchor="middle" class="lbl">• CAN-FD MAC</text>
  <text x="500" y="160" text-anchor="middle" class="lbl">• USB FS</text>
  <text x="500" y="178" text-anchor="middle" class="lbl">• SWD debug</text>
  <line class="sig" x1="360" y1="90" x2="400" y2="90" marker-end="url(#aE)"/>
  <line class="sig" x1="360" y1="160" x2="400" y2="160" marker-end="url(#aE)"/>

  <!-- CAN PHY -->
  <rect class="ctl" x="640" y="60" width="160" height="60"/>
  <text x="720" y="84" text-anchor="middle" class="lbl">CAN-FD PHY</text>
  <text x="720" y="102" text-anchor="middle" class="lbl">(MCP2542)</text>
  <line class="sig" x1="600" y1="90" x2="640" y2="90" marker-end="url(#aE)"/>
  <line class="sig" x1="800" y1="90" x2="840" y2="90"/>
  <text x="844" y="94" class="lbl">CAN bus</text>

  <!-- USB -->
  <rect class="ctl" x="640" y="140" width="160" height="40"/>
  <text x="720" y="164" text-anchor="middle" class="lbl">USB-C 2.0</text>
  <line class="sig" x1="600" y1="160" x2="640" y2="160" marker-end="url(#aE)"/>

  <!-- 4 channels -->
  <g>
    <rect class="ch" x="40"  y="260" width="220" height="220"/>
    <text x="150" y="284" text-anchor="middle" class="num">Channel 1</text>
    <text x="150" y="304" text-anchor="middle" class="lbl">half-bridge driver (DGD0506A)</text>
    <text x="150" y="322" text-anchor="middle" class="lbl">+ N-FETs (SI2318A ×2)</text>
    <text x="150" y="340" text-anchor="middle" class="lbl">+ inductor (22 µH) + cap</text>
    <text x="150" y="358" text-anchor="middle" class="lbl">+ shunt R = 0.02 Ω</text>
    <text x="150" y="376" text-anchor="middle" class="lbl">→ I_out, V_drive</text>
    <text x="150" y="396" text-anchor="middle" class="lbl">→ I_sense to MCU ADC</text>

    <rect class="ch" x="280" y="260" width="220" height="220"/>
    <text x="390" y="284" text-anchor="middle" class="num">Channel 2</text>
    <text x="390" y="304" text-anchor="middle" class="lbl">(identical to Ch 1)</text>

    <rect class="ch" x="520" y="260" width="220" height="220"/>
    <text x="630" y="284" text-anchor="middle" class="num">Channel 3</text>
    <text x="630" y="304" text-anchor="middle" class="lbl">(identical to Ch 1)</text>

    <rect class="ch" x="760" y="260" width="220" height="220"/>
    <text x="870" y="284" text-anchor="middle" class="num">Channel 4</text>
    <text x="870" y="304" text-anchor="middle" class="lbl">(identical to Ch 1)</text>
  </g>

  <!-- Connect MCU PWM/sense to channels -->
  <g>
    <line class="sig" x1="500" y1="220" x2="500" y2="240"/>
    <line class="sig" x1="150" y1="240" x2="870" y2="240"/>
    <line class="sig" x1="150" y1="240" x2="150" y2="260" marker-end="url(#aE)"/>
    <line class="sig" x1="390" y1="240" x2="390" y2="260" marker-end="url(#aE)"/>
    <line class="sig" x1="630" y1="240" x2="630" y2="260" marker-end="url(#aE)"/>
    <line class="sig" x1="870" y1="240" x2="870" y2="260" marker-end="url(#aE)"/>
    <text x="510" y="234" class="lbl">PWM / EN / I_sense (×4)</text>
  </g>

  <!-- output to load -->
  <g>
    <line class="sig" x1="150" y1="480" x2="150" y2="510" marker-end="url(#aE)"/>
    <line class="sig" x1="390" y1="480" x2="390" y2="510" marker-end="url(#aE)"/>
    <line class="sig" x1="630" y1="480" x2="630" y2="510" marker-end="url(#aE)"/>
    <line class="sig" x1="870" y1="480" x2="870" y2="510" marker-end="url(#aE)"/>
    <text x="150" y="528" text-anchor="middle" class="lbl">to X-phase A</text>
    <text x="390" y="528" text-anchor="middle" class="lbl">to X-phase B</text>
    <text x="630" y="528" text-anchor="middle" class="lbl">to Y-phase A</text>
    <text x="870" y="528" text-anchor="middle" class="lbl">to Y-phase B (or guard)</text>
  </g>

  <text x="500" y="558" text-anchor="middle" class="lbl">All four channels are bipolar, current-controlled, with constant-current regulation; LC filter limits ripple and EMI.</text>

  <defs>
    <marker id="aE" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a4fb0"/>
    </marker>
  </defs>
</svg>
