<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="Arial, sans-serif" font-size="13">
  <style>
    .ttl { font-size: 16px; font-weight: bold; }
    .ttl2 { font-size: 14px; font-weight: bold; }
    .lbl { font-size: 12px; }
    .frame { fill: none; stroke: #000; stroke-width: 1.4; }
    .pcb { fill: #cfe6cf; stroke: #000; stroke-width: 1.2; }
    .sled { fill: #f4d58d; stroke: #000; stroke-width: 1.2; }
    .obj { fill: #b9c9e6; stroke: #000; stroke-width: 1.2; }
    .well { fill: #fff; stroke: #000; }
    .blood { fill: #cc3a3a; }
    .chip { fill: #d8e6ff; stroke: #000; }
  </style>

  <text x="500" y="24" text-anchor="middle" class="ttl">FIG. 10 — Example Microscopy Sample Configurations</text>

  <!-- A: blood smear slide -->
  <g transform="translate(40,60)">
    <text x="180" y="0" text-anchor="middle" class="ttl2">(A) Blood smear on glass slide</text>
    <rect class="frame" x="0" y="14" width="360" height="180"/>
    <rect class="pcb" x="20" y="100" width="320" height="20"/>
    <rect class="sled" x="60" y="78" width="240" height="22" rx="3"/>
    <rect x="100" y="60" width="160" height="18" fill="#cdeaf7" stroke="#000"/>
    <g fill="#a02020">
      <ellipse cx="130" cy="69" rx="3" ry="2"/>
      <ellipse cx="150" cy="69" rx="3" ry="2"/>
      <ellipse cx="170" cy="69" rx="3" ry="2"/>
      <ellipse cx="190" cy="69" rx="3" ry="2"/>
      <ellipse cx="210" cy="69" rx="3" ry="2"/>
      <ellipse cx="230" cy="69" rx="3" ry="2"/>
    </g>
    <polygon class="obj" points="160,30 200,30 190,55 170,55"/>
    <text x="180" y="148" text-anchor="middle" class="lbl">26 × 76 mm slide on sled, raster scanned</text>
    <text x="180" y="166" text-anchor="middle" class="lbl">to image full smear at high resolution</text>
  </g>

  <!-- B: stool / fecal sample -->
  <g transform="translate(440,60)">
    <text x="180" y="0" text-anchor="middle" class="ttl2">(B) Fecal smear / parasitology</text>
    <rect class="frame" x="0" y="14" width="360" height="180"/>
    <rect class="pcb" x="20" y="100" width="320" height="20"/>
    <rect class="sled" x="60" y="78" width="240" height="22" rx="3"/>
    <rect x="100" y="60" width="160" height="18" fill="#e0d2a8" stroke="#000"/>
    <g fill="#5a4020">
      <circle cx="130" cy="69" r="2"/><circle cx="160" cy="69" r="3"/>
      <circle cx="180" cy="69" r="2"/><circle cx="210" cy="69" r="3"/>
      <circle cx="230" cy="69" r="2"/>
    </g>
    <polygon class="obj" points="160,30 200,30 190,55 170,55"/>
    <text x="180" y="148" text-anchor="middle" class="lbl">field-portable detection of helminth ova,</text>
    <text x="180" y="166" text-anchor="middle" class="lbl">protozoa, etc.</text>
  </g>

  <!-- C: multi-well plate -->
  <g transform="translate(40,250)">
    <text x="180" y="0" text-anchor="middle" class="ttl2">(C) Multi-well plate adapter</text>
    <rect class="frame" x="0" y="14" width="360" height="180"/>
    <rect class="pcb" x="20" y="120" width="320" height="20"/>
    <rect class="sled" x="40" y="92" width="280" height="28" rx="3"/>
    <g fill="#fff" stroke="#000">
      <circle class="well" cx="70"  cy="80" r="6"/>
      <circle class="well" cx="100" cy="80" r="6"/>
      <circle class="well" cx="130" cy="80" r="6"/>
      <circle class="well" cx="160" cy="80" r="6"/>
      <circle class="well" cx="190" cy="80" r="6"/>
      <circle class="well" cx="220" cy="80" r="6"/>
      <circle class="well" cx="250" cy="80" r="6"/>
      <circle class="well" cx="280" cy="80" r="6"/>
    </g>
    <polygon class="obj" points="160,40 200,40 190,65 170,65"/>
    <text x="180" y="166" text-anchor="middle" class="lbl">96-well or strip-format adapter, point-to-point scan</text>
  </g>

  <!-- D: microfluidic chip -->
  <g transform="translate(440,250)">
    <text x="180" y="0" text-anchor="middle" class="ttl2">(D) Microfluidic chip</text>
    <rect class="frame" x="0" y="14" width="360" height="180"/>
    <rect class="pcb" x="20" y="120" width="320" height="20"/>
    <rect class="sled" x="40" y="92" width="280" height="28" rx="3"/>
    <rect class="chip" x="60" y="60" width="240" height="32"/>
    <g stroke="#1a4fb0" stroke-width="2" fill="none">
      <path d="M70,76 H290"/>
      <path d="M120,68 V84"/>
      <path d="M180,68 V84"/>
      <path d="M240,68 V84"/>
    </g>
    <polygon class="obj" points="160,30 200,30 190,55 170,55"/>
    <text x="180" y="166" text-anchor="middle" class="lbl">droplet microfluidics, organ-on-chip imaging</text>
  </g>

  <text x="500" y="510" text-anchor="middle" class="lbl">All configurations are interchangeable on the same PCB stator; only the carriage adapter changes.</text>
</svg>
