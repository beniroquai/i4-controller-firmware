<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="Arial, sans-serif" font-size="13">
  <style>
    .ttl { font-size: 16px; font-weight: bold; }
    .lbl { font-size: 12px; }
    .num { font-size: 12px; font-weight: bold; }
    .mag { stroke: #000; stroke-width: 1.4; }
    .arr { stroke: #fff; stroke-width: 2; fill: none; }
    .field { stroke: #888; stroke-width: 1; fill: none; stroke-dasharray: 3 2; }
    .frame { fill: none; stroke: #000; stroke-width: 1.6; }
  </style>

  <text x="500" y="24" text-anchor="middle" class="ttl">FIG. 4 — Carriage Magnet Arrangements</text>

  <!-- (A) Simple alternating -->
  <g transform="translate(40,60)">
    <text x="140" y="0" text-anchor="middle" class="ttl" font-size="14">(A) Alternating N/S</text>
    <rect class="frame" x="0" y="20" width="280" height="60"/>
    <rect class="mag" x="10" y="30" width="40" height="40" fill="#3a3a8a"/>
    <rect class="mag" x="60" y="30" width="40" height="40" fill="#a83a3a"/>
    <rect class="mag" x="110" y="30" width="40" height="40" fill="#3a3a8a"/>
    <rect class="mag" x="160" y="30" width="40" height="40" fill="#a83a3a"/>
    <rect class="mag" x="210" y="30" width="40" height="40" fill="#3a3a8a"/>
    <g fill="#fff" text-anchor="middle">
      <text x="30" y="56">N</text><text x="80" y="56">S</text>
      <text x="130" y="56">N</text><text x="180" y="56">S</text><text x="230" y="56">N</text>
    </g>
    <text x="140" y="100" text-anchor="middle" class="lbl">simplest, symmetric field above &amp; below</text>
  </g>

  <!-- (B) Halbach -->
  <g transform="translate(360,60)">
    <text x="140" y="0" text-anchor="middle" class="ttl" font-size="14">(B) Halbach (linear)</text>
    <rect class="frame" x="0" y="20" width="280" height="60"/>
    <!-- 5-element Halbach: N-down, M-right, N-up, M-left, N-down (rotated 90 each) -->
    <g>
      <rect class="mag" x="10" y="30" width="50" height="40" fill="#3a3a8a"/>
      <line class="arr" x1="35" y1="65" x2="35" y2="35" marker-end="url(#wa)"/>
      <rect class="mag" x="65" y="30" width="50" height="40" fill="#5d5da0"/>
      <line class="arr" x1="70" y1="50" x2="110" y2="50" marker-end="url(#wa)"/>
      <rect class="mag" x="120" y="30" width="50" height="40" fill="#a83a3a"/>
      <line class="arr" x1="145" y1="35" x2="145" y2="65" marker-end="url(#wa)"/>
      <rect class="mag" x="175" y="30" width="50" height="40" fill="#5d5da0"/>
      <line class="arr" x1="220" y1="50" x2="180" y2="50" marker-end="url(#wa)"/>
      <rect class="mag" x="230" y="30" width="50" height="40" fill="#3a3a8a"/>
      <line class="arr" x1="255" y1="65" x2="255" y2="35" marker-end="url(#wa)"/>
    </g>
    <!-- Strong-side field below -->
    <path class="field" d="M0,90 Q140,140 280,90"/>
    <path class="field" d="M0,100 Q140,160 280,100"/>
    <text x="140" y="170" text-anchor="middle" class="lbl">augments field on strong side, cancels on weak side</text>
    <text x="140" y="186" text-anchor="middle" class="lbl">→ ~1.4× force per current; reduces stray field above sample</text>
  </g>

  <!-- (C) 2D / checker variant for the 4-wire grid -->
  <g transform="translate(40,260)">
    <text x="240" y="0" text-anchor="middle" class="ttl" font-size="14">(C) 2D arrangement matched to grid pitch</text>
    <rect class="frame" x="0" y="20" width="480" height="200"/>

    <!-- 4x4 grid of magnets, alternating in checkerboard, rotated 45° relative to outline -->
    <g transform="translate(240,120) rotate(45)">
      <g>
        <rect class="mag" x="-80" y="-80" width="40" height="40" fill="#3a3a8a"/>
        <rect class="mag" x="-40" y="-80" width="40" height="40" fill="#a83a3a"/>
        <rect class="mag" x="0"   y="-80" width="40" height="40" fill="#3a3a8a"/>
        <rect class="mag" x="40"  y="-80" width="40" height="40" fill="#a83a3a"/>
        <rect class="mag" x="-80" y="-40" width="40" height="40" fill="#a83a3a"/>
        <rect class="mag" x="-40" y="-40" width="40" height="40" fill="#3a3a8a"/>
        <rect class="mag" x="0"   y="-40" width="40" height="40" fill="#a83a3a"/>
        <rect class="mag" x="40"  y="-40" width="40" height="40" fill="#3a3a8a"/>
        <rect class="mag" x="-80" y="0"   width="40" height="40" fill="#3a3a8a"/>
        <rect class="mag" x="-40" y="0"   width="40" height="40" fill="#a83a3a"/>
        <rect class="mag" x="0"   y="0"   width="40" height="40" fill="#3a3a8a"/>
        <rect class="mag" x="40"  y="0"   width="40" height="40" fill="#a83a3a"/>
        <rect class="mag" x="-80" y="40"  width="40" height="40" fill="#a83a3a"/>
        <rect class="mag" x="-40" y="40"  width="40" height="40" fill="#3a3a8a"/>
        <rect class="mag" x="0"   y="40"  width="40" height="40" fill="#a83a3a"/>
        <rect class="mag" x="40"  y="40"  width="40" height="40" fill="#3a3a8a"/>
      </g>
    </g>
    <text x="240" y="240" text-anchor="middle" class="lbl">spacing tied to grid pitch by factor √2; orientation 45° optimizes</text>
    <text x="240" y="256" text-anchor="middle" class="lbl">force coupling for orthogonal X- and Y-trace sets</text>
  </g>

  <!-- (D) Electromagnet alternative -->
  <g transform="translate(560,260)">
    <text x="200" y="0" text-anchor="middle" class="ttl" font-size="14">(D) Electromagnet variant</text>
    <rect class="frame" x="0" y="20" width="400" height="200"/>
    <g transform="translate(60,40)">
      <rect x="0" y="40" width="80" height="100" fill="#dddddd" stroke="#000"/>
      <g stroke="#9b6b00" stroke-width="3" fill="none">
        <path d="M0,50 Q40,40 80,50"/>
        <path d="M0,70 Q40,60 80,70"/>
        <path d="M0,90 Q40,80 80,90"/>
        <path d="M0,110 Q40,100 80,110"/>
        <path d="M0,130 Q40,120 80,130"/>
      </g>
      <text x="40" y="160" text-anchor="middle" class="lbl">core + coil</text>
    </g>
    <g transform="translate(220,40)">
      <rect x="0" y="40" width="80" height="100" fill="#dddddd" stroke="#000"/>
      <g stroke="#9b6b00" stroke-width="3" fill="none">
        <path d="M0,50 Q40,40 80,50"/>
        <path d="M0,70 Q40,60 80,70"/>
        <path d="M0,90 Q40,80 80,90"/>
        <path d="M0,110 Q40,100 80,110"/>
        <path d="M0,130 Q40,120 80,130"/>
      </g>
    </g>
    <text x="200" y="200" text-anchor="middle" class="lbl">tunable coupling, active damping, field shaping</text>
  </g>

  <defs>
    <marker id="wa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#fff" stroke="#fff"/>
    </marker>
  </defs>
</svg>
