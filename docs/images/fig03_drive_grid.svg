<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Arial, sans-serif" font-size="13">
  <style>
    .ttl { font-size: 16px; font-weight: bold; }
    .lbl { font-size: 12px; }
    .num { font-size: 12px; font-weight: bold; }
    .pcb { fill: #eef6ee; stroke: #000; stroke-width: 1.6; }
    .xa { stroke: #1a4fb0; stroke-width: 2.6; fill: none; }
    .xb { stroke: #6da4ff; stroke-width: 2.6; fill: none; }
    .ya { stroke: #b01a4f; stroke-width: 2.6; fill: none; }
    .yb { stroke: #ff7da6; stroke-width: 2.6; fill: none; }
    .grd { stroke: #2a8a2a; stroke-width: 3; fill: none; stroke-dasharray: 2 2; }
    .mag { fill: #444; stroke: #000; }
    .ln { stroke: #000; stroke-width: 1; fill: none; }
  </style>

  <text x="500" y="24" text-anchor="middle" class="ttl">FIG. 3 — Two-axis Drive Grid (top view, segment of PCB stator)</text>

  <!-- Outer PCB rectangle -->
  <rect class="pcb" x="80" y="60" width="640" height="500"/>
  <text x="730" y="78" class="num">140</text>

  <!-- X-axis traces (horizontal) - phase A blue solid -->
  <g>
    <line class="xa" x1="100" y1="100" x2="700" y2="100"/>
    <line class="xa" x1="100" y1="160" x2="700" y2="160"/>
    <line class="xa" x1="100" y1="220" x2="700" y2="220"/>
    <line class="xa" x1="100" y1="280" x2="700" y2="280"/>
    <line class="xa" x1="100" y1="340" x2="700" y2="340"/>
    <line class="xa" x1="100" y1="400" x2="700" y2="400"/>
    <line class="xa" x1="100" y1="460" x2="700" y2="460"/>
    <line class="xa" x1="100" y1="520" x2="700" y2="520"/>
  </g>
  <!-- X-axis phase B (offset by half pitch) -->
  <g>
    <line class="xb" x1="100" y1="130" x2="700" y2="130"/>
    <line class="xb" x1="100" y1="190" x2="700" y2="190"/>
    <line class="xb" x1="100" y1="250" x2="700" y2="250"/>
    <line class="xb" x1="100" y1="310" x2="700" y2="310"/>
    <line class="xb" x1="100" y1="370" x2="700" y2="370"/>
    <line class="xb" x1="100" y1="430" x2="700" y2="430"/>
    <line class="xb" x1="100" y1="490" x2="700" y2="490"/>
  </g>

  <!-- Y-axis traces (vertical) - phase A solid red, on different layer -->
  <g opacity="0.55">
    <line class="ya" x1="130" y1="80" x2="130" y2="540"/>
    <line class="ya" x1="190" y1="80" x2="190" y2="540"/>
    <line class="ya" x1="250" y1="80" x2="250" y2="540"/>
    <line class="ya" x1="310" y1="80" x2="310" y2="540"/>
    <line class="ya" x1="370" y1="80" x2="370" y2="540"/>
    <line class="ya" x1="430" y1="80" x2="430" y2="540"/>
    <line class="ya" x1="490" y1="80" x2="490" y2="540"/>
    <line class="ya" x1="550" y1="80" x2="550" y2="540"/>
    <line class="ya" x1="610" y1="80" x2="610" y2="540"/>
    <line class="ya" x1="670" y1="80" x2="670" y2="540"/>
  </g>
  <g opacity="0.55">
    <line class="yb" x1="160" y1="80" x2="160" y2="540"/>
    <line class="yb" x1="220" y1="80" x2="220" y2="540"/>
    <line class="yb" x1="280" y1="80" x2="280" y2="540"/>
    <line class="yb" x1="340" y1="80" x2="340" y2="540"/>
    <line class="yb" x1="400" y1="80" x2="400" y2="540"/>
    <line class="yb" x1="460" y1="80" x2="460" y2="540"/>
    <line class="yb" x1="520" y1="80" x2="520" y2="540"/>
    <line class="yb" x1="580" y1="80" x2="580" y2="540"/>
    <line class="yb" x1="640" y1="80" x2="640" y2="540"/>
  </g>

  <!-- Magnet array on carriage rotated 45° relative to grid (per draft note) -->
  <g transform="translate(390,300) rotate(45)">
    <rect class="mag" x="-50" y="-50" width="100" height="100" opacity="0.85"/>
    <g fill="#fff" font-size="11" text-anchor="middle">
      <text x="-25" y="-22">N</text>
      <text x="25" y="-22">S</text>
      <text x="-25" y="32">S</text>
      <text x="25" y="32">N</text>
    </g>
  </g>
  <text x="490" y="296" class="num">130</text>
  <text x="510" y="296" class="lbl">magnet array (rotated 45° to grid)</text>

  <!-- Pitch indication -->
  <line class="ln" x1="100" y1="585" x2="160" y2="585" marker-start="url(#aL)" marker-end="url(#aL)"/>
  <text x="130" y="600" text-anchor="middle" class="lbl">pitch p</text>

  <!-- Legend -->
  <g transform="translate(740,90)">
    <text x="0" y="0" class="ttl" font-size="13">Legend</text>
    <line class="xa" x1="0" y1="20" x2="40" y2="20"/><text x="48" y="24" class="lbl">X-phase A</text>
    <line class="xb" x1="0" y1="40" x2="40" y2="40"/><text x="48" y="44" class="lbl">X-phase B</text>
    <line class="ya" x1="0" y1="60" x2="40" y2="60"/><text x="48" y="64" class="lbl">Y-phase A</text>
    <line class="yb" x1="0" y1="80" x2="40" y2="80"/><text x="48" y="84" class="lbl">Y-phase B</text>
    <line class="grd" x1="0" y1="100" x2="40" y2="100"/><text x="48" y="104" class="lbl">guard</text>
  </g>

  <!-- Guard traces around perimeter (segment) -->
  <line class="grd" x1="90" y1="70" x2="710" y2="70"/>
  <line class="grd" x1="90" y1="550" x2="710" y2="550"/>
  <line class="grd" x1="90" y1="70" x2="90" y2="550"/>
  <line class="grd" x1="710" y1="70" x2="710" y2="550"/>
  <text x="730" y="62" class="num">147</text>
  <text x="730" y="552" class="lbl">guard</text>

  <defs>
    <marker id="aL" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
</svg>
