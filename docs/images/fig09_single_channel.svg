<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="Arial, sans-serif" font-size="13">
  <style>
    .ttl { font-size: 16px; font-weight: bold; }
    .lbl { font-size: 12px; }
    .num { font-size: 12px; font-weight: bold; }
    .ln { stroke: #000; stroke-width: 1.6; fill: none; }
    .thin { stroke: #000; stroke-width: 1; fill: none; }
  </style>

  <text x="500" y="24" text-anchor="middle" class="ttl">FIG. 9 — Single-channel Bipolar Current Driver (one of four)</text>

  <!-- V_drive rail -->
  <line class="ln" x1="80" y1="80" x2="920" y2="80"/>
  <text x="60" y="84" class="num">V_drive</text>

  <!-- GND rail -->
  <line class="ln" x1="80" y1="460" x2="920" y2="460"/>
  <text x="60" y="464" class="num">GND</text>

  <!-- Left half-bridge -->
  <g>
    <!-- High-side FET -->
    <line class="ln" x1="240" y1="80" x2="240" y2="140"/>
    <rect x="220" y="140" width="40" height="40" fill="#fff" stroke="#000" stroke-width="1.4"/>
    <text x="240" y="164" text-anchor="middle" class="lbl">Q1</text>
    <line class="ln" x1="200" y1="160" x2="220" y2="160"/>
    <text x="180" y="164" text-anchor="end" class="lbl">HS_L</text>
    <line class="ln" x1="240" y1="180" x2="240" y2="240"/>

    <!-- Output node A -->
    <circle cx="240" cy="240" r="3" fill="#000"/>
    <text x="248" y="234" class="num">OUT+</text>

    <!-- Low-side FET -->
    <line class="ln" x1="240" y1="240" x2="240" y2="320"/>
    <rect x="220" y="320" width="40" height="40" fill="#fff" stroke="#000" stroke-width="1.4"/>
    <text x="240" y="344" text-anchor="middle" class="lbl">Q2</text>
    <line class="ln" x1="200" y1="340" x2="220" y2="340"/>
    <text x="180" y="344" text-anchor="end" class="lbl">LS_L</text>
    <line class="ln" x1="240" y1="360" x2="240" y2="430"/>

    <!-- Shunt -->
    <rect x="220" y="430" width="40" height="20" fill="#fff" stroke="#000"/>
    <text x="270" y="446" class="lbl">R_shunt 0.02 Ω</text>
    <line class="ln" x1="240" y1="450" x2="240" y2="460"/>

    <!-- Gate driver block -->
    <rect x="80" y="220" width="120" height="120" fill="#eef4ff" stroke="#000" stroke-width="1.4"/>
    <text x="140" y="248" text-anchor="middle" class="lbl">Gate driver</text>
    <text x="140" y="266" text-anchor="middle" class="lbl">DGD0506A</text>
    <text x="140" y="284" text-anchor="middle" class="lbl">(half-bridge)</text>
    <text x="140" y="310" text-anchor="middle" class="lbl">PWM_L</text>
    <text x="140" y="326" text-anchor="middle" class="lbl">EN</text>
  </g>

  <!-- LC filter -->
  <g>
    <line class="ln" x1="240" y1="240" x2="370" y2="240"/>
    <!-- Inductor symbol -->
    <path class="ln" d="M370,240 q10,-12 20,0 t20,0 t20,0 t20,0"/>
    <text x="410" y="222" text-anchor="middle" class="lbl">L 22 µH</text>
    <line class="ln" x1="450" y1="240" x2="540" y2="240"/>
    <!-- Cap to GND -->
    <line class="ln" x1="500" y1="240" x2="500" y2="280"/>
    <line class="ln" x1="488" y1="280" x2="512" y2="280"/>
    <line class="ln" x1="488" y1="290" x2="512" y2="290"/>
    <text x="520" y="290" class="lbl">C</text>
    <line class="ln" x1="500" y1="290" x2="500" y2="460"/>
  </g>

  <!-- Right half-bridge -->
  <g>
    <line class="ln" x1="700" y1="80" x2="700" y2="140"/>
    <rect x="680" y="140" width="40" height="40" fill="#fff" stroke="#000" stroke-width="1.4"/>
    <text x="700" y="164" text-anchor="middle" class="lbl">Q3</text>
    <line class="ln" x1="660" y1="160" x2="680" y2="160"/>
    <text x="640" y="164" text-anchor="end" class="lbl">HS_R</text>
    <line class="ln" x1="700" y1="180" x2="700" y2="240"/>

    <circle cx="700" cy="240" r="3" fill="#000"/>
    <text x="708" y="234" class="num">OUT−</text>

    <line class="ln" x1="700" y1="240" x2="700" y2="320"/>
    <rect x="680" y="320" width="40" height="40" fill="#fff" stroke="#000" stroke-width="1.4"/>
    <text x="700" y="344" text-anchor="middle" class="lbl">Q4</text>
    <line class="ln" x1="660" y1="340" x2="680" y2="340"/>
    <text x="640" y="344" text-anchor="end" class="lbl">LS_R</text>
    <line class="ln" x1="700" y1="360" x2="700" y2="460"/>

    <rect x="540" y="220" width="120" height="120" fill="#eef4ff" stroke="#000" stroke-width="1.4"/>
    <text x="600" y="248" text-anchor="middle" class="lbl">Gate driver</text>
    <text x="600" y="266" text-anchor="middle" class="lbl">DGD0506A</text>
    <text x="600" y="284" text-anchor="middle" class="lbl">(half-bridge)</text>
    <text x="600" y="310" text-anchor="middle" class="lbl">PWM_R</text>
    <text x="600" y="326" text-anchor="middle" class="lbl">EN</text>
  </g>

  <!-- LOAD between OUT+ and OUT- -->
  <g>
    <rect x="430" y="125" width="80" height="40" fill="#fff7d8" stroke="#000" stroke-width="1.4"/>
    <text x="470" y="150" text-anchor="middle" class="lbl">PCB phase trace</text>
    <line class="ln" x1="240" y1="240" x2="240" y2="145"/>
    <line class="ln" x1="240" y1="145" x2="430" y2="145"/>
    <line class="ln" x1="510" y1="145" x2="700" y2="145"/>
    <line class="ln" x1="700" y1="145" x2="700" y2="240"/>
  </g>

  <!-- I_sense path -->
  <g>
    <line class="thin" x1="260" y1="440" x2="900" y2="440"/>
    <line class="thin" x1="900" y1="440" x2="900" y2="100"/>
    <line class="thin" x1="900" y1="100" x2="860" y2="100"/>
    <rect x="780" y="80" width="80" height="40" fill="#e6f7e6" stroke="#000"/>
    <text x="820" y="104" text-anchor="middle" class="lbl">I_sense → ADC</text>
  </g>

  <text x="500" y="500" text-anchor="middle" class="lbl">Constant-current regulation makes drive insensitive to trace resistance, V_drive variation, and temperature.</text>
  <text x="500" y="518" text-anchor="middle" class="lbl">L · C filter on the output limits di/dt ripple and EMI; the trace itself contributes additional inductance.</text>
</svg>
