<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" font-family="Arial, sans-serif" font-size="13">
  <style>
    .ttl { font-size: 16px; font-weight: bold; }
    .lbl { font-size: 12px; }
    .num { font-size: 12px; font-weight: bold; }
    .tile { fill: #eef6ee; stroke: #000; stroke-width: 1.4; }
    .tilea { fill: #d6efd6; stroke: #000; stroke-width: 1.4; }
    .tileon { fill: #ffe49a; stroke: #000; stroke-width: 1.6; }
    .drv { fill: #eef4ff; stroke: #000; stroke-width: 1.2; }
    .bus { stroke: #1a4fb0; stroke-width: 2.4; fill: none; }
    .sled { fill: #f4d58d; stroke: #000; stroke-width: 1.4; opacity:.85; }
  </style>

  <text x="500" y="24" text-anchor="middle" class="ttl">FIG. 7 — Segmented / Tiled PCB Stator for Power Reduction and Scaling</text>

  <!-- 4x4 grid of tiles -->
  <g transform="translate(80,60)">
    <g>
      <rect class="tile" x="0"   y="0"   width="160" height="100"/>
      <rect class="tile" x="160" y="0"   width="160" height="100"/>
      <rect class="tile" x="320" y="0"   width="160" height="100"/>
      <rect class="tile" x="480" y="0"   width="160" height="100"/>

      <rect class="tile" x="0"   y="100" width="160" height="100"/>
      <rect class="tileon" x="160" y="100" width="160" height="100"/>
      <rect class="tileon" x="320" y="100" width="160" height="100"/>
      <rect class="tile" x="480" y="100" width="160" height="100"/>

      <rect class="tile" x="0"   y="200" width="160" height="100"/>
      <rect class="tile" x="160" y="200" width="160" height="100"/>
      <rect class="tile" x="320" y="200" width="160" height="100"/>
      <rect class="tile" x="480" y="200" width="160" height="100"/>

      <rect class="tile" x="0"   y="300" width="160" height="100"/>
      <rect class="tile" x="160" y="300" width="160" height="100"/>
      <rect class="tile" x="320" y="300" width="160" height="100"/>
      <rect class="tile" x="480" y="300" width="160" height="100"/>
    </g>

    <!-- sled spanning two active tiles -->
    <rect class="sled" x="240" y="130" width="160" height="42" rx="4"/>
    <text x="320" y="158" text-anchor="middle" class="lbl">carriage (120)</text>

    <!-- tile labels -->
    <text x="80" y="60" text-anchor="middle" class="num">T1,1</text>
    <text x="240" y="60" text-anchor="middle" class="num">T1,2</text>
    <text x="400" y="60" text-anchor="middle" class="num">T1,3</text>
    <text x="560" y="60" text-anchor="middle" class="num">T1,4</text>

    <text x="80" y="200" text-anchor="middle" class="num">T2,1</text>
    <text x="80" y="300" text-anchor="middle" class="num">T3,1</text>
    <text x="80" y="400" text-anchor="middle" class="num">T4,1</text>

    <text x="320" y="220" text-anchor="middle" class="num">T2,2 (ON)</text>
    <text x="480" y="220" text-anchor="middle" class="num">T2,3 (ON)</text>
  </g>

  <!-- right side: per-tile driver block diagram -->
  <g transform="translate(770,80)">
    <rect class="drv" x="0" y="0" width="200" height="60"/>
    <text x="100" y="22" text-anchor="middle" class="lbl">Local tile driver</text>
    <text x="100" y="40" text-anchor="middle" class="lbl">µC + H-bridges</text>

    <line class="bus" x1="100" y1="60" x2="100" y2="100" marker-end="url(#aD)"/>
    <rect class="drv" x="0" y="100" width="200" height="60"/>
    <text x="100" y="122" text-anchor="middle" class="lbl">Tile actuator</text>
    <text x="100" y="140" text-anchor="middle" class="lbl">(local PCB segment)</text>

    <line class="bus" x1="-30" y1="30" x2="0" y2="30" marker-end="url(#aD)"/>
    <text x="-100" y="34" class="lbl">CAN / RS-485</text>
  </g>

  <!-- Bus connecting tiles -->
  <g>
    <line class="bus" x1="80"  y1="500" x2="720" y2="500"/>
    <line class="bus" x1="160" y1="460" x2="160" y2="500"/>
    <line class="bus" x1="320" y1="460" x2="320" y2="500"/>
    <line class="bus" x1="480" y1="460" x2="480" y2="500"/>
    <line class="bus" x1="640" y1="460" x2="640" y2="500"/>
    <text x="400" y="520" text-anchor="middle" class="lbl">multi-drop bus (CAN bus shown) — only tiles under or near the sled are powered</text>
  </g>

  <defs>
    <marker id="aD" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a4fb0"/>
    </marker>
  </defs>
</svg>
